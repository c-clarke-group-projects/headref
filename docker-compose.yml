# 2 containers only. DEC-013: no Redis, no queue, no vector database.
# Ollama runs on the host, not here. DEC-017 and the 7.7 GB RAM constraint.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: headref
      POSTGRES_PASSWORD: headref
      POSTGRES_DB: headref
    ports:
      - "5432:5432"
    volumes:
      - headref_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U headref -d headref" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    # Host port is configurable. Windows reserves several TCP ranges for Hyper-V
    # (check with: netsh interface ipv4 show excludedportrange protocol=tcp) and
    # 8000 often falls inside one, which makes the bind fail. Set API_PORT in .env
    # to any free port. The container port stays 8000.
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Reaches Ollama on the host. host-gateway is needed on Linux; Docker Desktop
    # on Windows and macOS resolves host.docker.internal on its own.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

volumes:
  headref_pgdata:
